<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/sign-in.css">
    <script type="module" src="../components/logo.js"></script>
    <script src="../components/arrow.js" defer></script>
    <script src="../components/tooltip.js" defer></script>
    <script src="../scripties/display.js" defer></script>
    <script src="../scripties/sign-in.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <title>ArtSwapp - Sign in</title>
</head>
<body data-page="form">
    <main>

        <div>
        <div class="tabthingies"><span class="tab">Register</span><span> ❤︎ </span><span class="tab">Sign in</span></div>

        

        <form id="registration-1">
             <div class="field-label">
                <label for="email">Email</label>
                <span class="help-tooltip">
                    <button type="button" class="help-icon" aria-label="Email requirements" aria-expanded="false">?</button>
                    <my-tooltip position="bottom-left">format@example.yeah</my-tooltip>
                </span>
            </div>
            <input type="email" id="email" name="email"  >

            <div class="field-label">
                <label for="password">Password</label>
                <span class="help-tooltip">
                    <button type="button" class="help-icon" aria-label="Password requirements" aria-expanded="false">?</button>
                    <my-tooltip position="bottom-left">The password:<br>- must be 8 charcters long,<br>- must include an uppercase letter,<br>- must include a number,<br>- must include a  special character.</my-tooltip>
                </span>
                </div>

                <input type="password" id="password" name="password"  >
            


            <button type="submit" id="registration-continue">Continue ></button>
        </form>

        <form id="registration-2">
            
            <label for="username">Username</label>
            <input type="text" id="username" name="username"  >

            <label for="displayname">Display name</label>
            <input type="text" id="displayname" name="displayname"   >

            <label>
                <input type="checkbox" name="newsletterOptIn">
                sub to the newsletter... pretty pwease.....
            </label>

            <button type="button" id="registration-back">&lt; Back</button>
           

            <button type="submit" id="submit-button">Register</button>
        </form>
      
        <form id="signin">
            <label for="email2">Email / Username</label>
            <input type="text" id="email2" name="email" autocomplete="email"  >

            <label for="password2">Password</label>
            <input type="password" id="password2" name="password"  >

            
            <button type="submit" id="signin-button">Sign in</button>
        </form>
        <div id="registration-status" role="status" aria-live="polite">
            <span id="registration-status-message"></span>
        </div>
        
            <p id="login-status" role="status"></p>
        
        </div>
    </main>

    
    

</body>
</html>
